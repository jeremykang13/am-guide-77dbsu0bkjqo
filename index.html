<meta charset="utf-8">
<title>앨리스문 촬영 가이드</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* 레이아웃: 단일 컬럼(최대 520px) · 상단 고정 바 · 하단 탭 5개 · 컷 상세는 아래에서 올라오는 시트.
   색: 밝게(야외 햇빛) / 어둡게(실내·밤) 두 가지. 기본은 폰 설정을 따르고, 상단 버튼으로 바꿀 수 있어요. */
:root {
  --bg: #F3F6FD;
  --surface: #FFFFFF;
  --surface2: #E8EDFA;
  --fg: #0C0F20;
  --fg2: #444B66;
  --line: #C9D1E8;
  --accent: #2F44D1;
  --accent-soft: #DCE4FF;
  --grad: linear-gradient(135deg, #A8C6FF 0%, #5A70F2 100%);
  --on-grad: #060A24;
  --ok: #17785A;
  --ok-soft: #D4F1E5;
  --hero-bg: linear-gradient(160deg, #BFD5FF 0%, #98AEFB 100%);
  --hero-fg: #080C26;
  --focus: #2F44D1;
  --shadow: 0 1px 2px rgba(20,30,80,.08), 0 6px 20px rgba(20,30,80,.06);
  --font: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --serif: "Cormorant Garamond", "Noto Serif KR", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07080D; --surface: #12141E; --surface2: #1B1F2E; --fg: #F5F7FF; --fg2: #BDC3DA;
    --line: #2D3249; --accent: #A8C6FF; --accent-soft: #1E2748; --ok: #9CE3C3; --ok-soft: #123226;
    --hero-bg: linear-gradient(160deg, #1A2046 0%, #0E1022 100%); --hero-fg: #F5F7FF;
    --focus: #A8C6FF; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07080D; --surface: #12141E; --surface2: #1B1F2E; --fg: #F5F7FF; --fg2: #BDC3DA;
  --line: #2D3249; --accent: #A8C6FF; --accent-soft: #1E2748; --ok: #9CE3C3; --ok-soft: #123226;
  --hero-bg: linear-gradient(160deg, #1A2046 0%, #0E1022 100%); --hero-fg: #F5F7FF;
  --focus: #A8C6FF; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 130px; }
body {
  background: var(--bg); color: var(--fg); font: 400 17px/1.65 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 110px; overflow-x: hidden; overflow-wrap: anywhere; word-break: keep-all;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 520px; margin: 0 auto; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
strong { font-weight: 700; }

/* 상단 바 */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 60px; gap: 8px; }
.brand { text-decoration: none; display: flex; align-items: baseline; gap: 10px; min-height: 44px; align-items: center; }
.brand b { font: italic 500 26px/1 var(--serif); letter-spacing: .01em; }
.brand span { font-size: 15px; color: var(--fg2); font-weight: 400; }
.brand, .brand b, .themebtn, .themebtn span { white-space: nowrap; }
@media (max-width: 400px) { .brand span { display: none; } }
main:focus, main:focus-visible { outline: none; }
.themebtn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 500; }

/* 하단 탭 */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-right, 0px)); }
.nav ul { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; text-decoration: none; font-size: 14px; font-weight: 500; color: var(--fg2); border-radius: 12px; }
.nav a[aria-current="page"] { color: var(--accent); font-weight: 700; }
.nav a[aria-current="page"] svg { stroke-width: 2.4; }

main { padding-block: 8px 24px; outline: none; display: flex; flex-direction: column; gap: 28px; }
.pagehead { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
h1 { font-size: 28px; line-height: 1.3; font-weight: 800; text-wrap: balance; }
h2 { font-size: 22px; line-height: 1.35; font-weight: 800; text-wrap: balance; }
h3 { font-size: 19px; line-height: 1.4; font-weight: 700; }
.lead { color: var(--fg2); font-size: 18px; }
.eyebrow { font-size: 15px; font-weight: 700; letter-spacing: .06em; color: var(--accent); }
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec > h2 { padding-top: 4px; }
.muted { color: var(--fg2); }
.small { font-size: 15px; }

/* 카드 · 버튼 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 20px; border-radius: 16px; font-weight: 700; font-size: 18px; text-decoration: none; text-align: center; }
.btn.primary { background: var(--grad); color: var(--on-grad); }
.btn.line { border: 1.5px solid var(--accent); color: var(--accent); background: transparent; }
.btn.soft { background: var(--surface2); color: var(--fg); }
.btn[disabled], .btn.pending { background: var(--surface2); color: var(--fg2); cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 10px; border-radius: 14px; font-size: 14.5px; font-weight: 700; line-height: 1.2; background: var(--surface2); color: var(--fg); }
.chip.req { background: var(--accent); color: var(--bg); }
.chip.opt { background: transparent; border: 1.5px solid var(--line); color: var(--fg2); }
.chip.land { background: var(--accent-soft); color: var(--accent); border: 1.5px solid var(--accent); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip svg.i { width: 17px; height: 17px; }
.num { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; border-radius: 50%; background: var(--grad); color: var(--on-grad); font-weight: 800; font-size: 18px; flex: none; }

/* 진행률 */
.prog { display: flex; flex-direction: column; gap: 6px; }
.prog .bar { height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
.prog .bar i { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 5px; transition: width .25s ease; }
.prog .txt { font-size: 15px; color: var(--fg2); font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.prog.done .txt { color: var(--ok); font-weight: 700; }

/* 홈 */
.hero { background: var(--hero-bg); color: var(--hero-fg); border-radius: 22px; padding: 24px 20px 22px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); }
.hero .eyebrow { color: inherit; opacity: .8; }
.hero h1 { font-size: 27px; }
.hero p { font-size: 18px; line-height: 1.7; }
.deadline { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; }
.deadline .lbl { font-size: 15px; font-weight: 700; color: var(--fg2); }
.deadline .date { font-size: 30px; font-weight: 800; line-height: 1.2; }
.dday { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; justify-content: center; min-width: 84px; height: 84px; border-radius: 42px; background: var(--grad); color: var(--on-grad); font-weight: 800; font-size: 24px; }
.deadline .copy { grid-column: 1 / -1; padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--line); }
.shortcut { display: flex; align-items: center; gap: 14px; text-decoration: none; min-height: 72px; border: 1.5px solid var(--accent); }
.shortcut .tag { font-size: 24px; font-weight: 800; color: var(--accent); min-width: 52px; }
.shortcut b { display: block; font-size: 18px; }

.clist { display: flex; flex-direction: column; gap: 12px; }
.ccard { display: grid; grid-template-columns: 44px 1fr; gap: 6px 14px; text-decoration: none; }
.ccard .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 6px 0 8px; }
.ccard h3 { font-size: 20px; }
.ccard .kind { font-size: 15px; color: var(--fg2); }
.ccard .prog { grid-column: 2; }

/* 컷 카드 */
.cutlist { display: flex; flex-direction: column; gap: 10px; }
.cut { display: grid; grid-template-columns: 72px 1fr; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.cut.is-land { border-color: var(--accent); }
.chk { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 72px; padding: 8px 0; cursor: pointer; position: relative; background: var(--surface2); }
.chk .lbl { font-size: 14px; font-weight: 700; color: var(--fg2); line-height: 1.2; }
.cut.is-done .chk .lbl { color: var(--ok); }
.chk input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chk .box { width: 30px; height: 30px; border-radius: 9px; border: 2.5px solid var(--fg2); display: flex; align-items: center; justify-content: center; background: var(--surface); color: transparent; }
.chk .box svg { width: 20px; height: 20px; stroke-width: 3.2; }
.chk input:checked + .box { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.chk input:focus-visible + .box { outline: 3px solid var(--focus); outline-offset: 2px; }
.cut-main { display: flex; flex-direction: column; gap: 4px; padding: 14px 14px 14px 14px; min-width: 0; min-height: 56px; }
.cut-main .top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.cut-title { font-weight: 700; font-size: 18px; line-height: 1.4; }
.cut-what { font-size: 16.5px; color: var(--fg2); line-height: 1.5; }
.cut-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 4px; font-size: 15px; color: var(--fg2); }
.cut.is-done { background: color-mix(in srgb, var(--ok-soft) 55%, var(--surface)); }
.cut.is-done .cut-title { color: var(--fg2); }
.more { display: inline-flex; align-items: center; gap: 2px; font-size: 15px; color: var(--accent); font-weight: 700; }

/* 구간 */
.landbanner { background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 18px; padding: 16px; display: grid; grid-template-columns: 56px 1fr; gap: 6px 14px; align-items: center; }
.landbanner .rot { width: 56px; height: 56px; border-radius: 16px; background: var(--accent); color: var(--bg); display: flex; align-items: center; justify-content: center; }
.landbanner .rot svg { width: 34px; height: 34px; }
.landbanner b { font-size: 20px; line-height: 1.4; display: block; }
.landbanner p { grid-column: 1 / -1; }
.landbanner .hl { font-weight: 700; }

/* 레퍼런스 */
.refbox { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.refmedia { position: relative; width: 100%; max-width: 300px; border-radius: 18px; overflow: hidden; background: var(--surface2); border: 1px solid var(--line); }
.refmedia img { display: block; width: 100%; height: auto; }
.refmedia .play { position: absolute; inset: auto 12px 12px auto; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(8,10,28,.82); color: #fff; font-weight: 700; font-size: 16px; }
.refcap { text-align: center; color: var(--fg2); font-size: 16px; }
.links { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.links a { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 14px; text-decoration: none; font-weight: 700; background: var(--surface); }
.links a svg { width: 20px; height: 20px; color: var(--accent); }

/* 콘텐츠 상세 */
.chead { display: flex; flex-direction: column; gap: 12px; }
.chead .row { display: flex; align-items: center; gap: 14px; }
.chead .badges { display: flex; flex-wrap: wrap; gap: 8px; }
.chead h1 { font-size: 30px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.facts { display: flex; flex-direction: column; }
.facts > div { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.facts > div:first-child { border-top: 0; padding-top: 0; }
.facts dt { font-weight: 800; color: var(--fg2); font-size: 16px; padding-top: 1px; }
.facts dd { margin: 0; min-width: 0; }
.facts dl { margin: 0; }
.avoid { display: flex; flex-direction: column; gap: 10px; }
.avoid li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface2); border-radius: 14px; padding: 12px 14px; }
.avoid .x { font-weight: 800; font-size: 20px; line-height: 1.4; color: var(--fg2); text-align: center; }
.avoid b { display: block; }
.avoid .why { color: var(--fg2); font-size: 16.5px; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.examples span { padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--line); font-size: 16px; background: var(--surface); }
.timeline { display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 28px 1fr; gap: 14px; padding-bottom: 18px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child { padding-bottom: 0; } .timeline li:last-child::before { display: none; }
.timeline .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--grad); }
.timeline b { display: block; font-size: 18px; }
.timeline .when { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 2px; }
.setup { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; }
.setup .big { font-size: 24px; font-weight: 800; color: var(--accent); }
.setup p { grid-column: 1 / -1; }
.confirmlist { display: flex; flex-direction: column; gap: 10px; }
.qlink { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; text-decoration: none; min-height: 56px; }
.qlink b { display: block; }
.note { display: grid; grid-template-columns: 24px 1fr; gap: 10px; background: var(--surface2); border-radius: 14px; padding: 14px; }

/* 공통 가이드 */
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg3 button { min-height: 56px; padding: 6px 8px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); text-align: center; font-weight: 700; font-size: 17px; line-height: 1.3; display: flex; align-items: center; justify-content: center; }
.seg3 button[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.path span { padding: 6px 12px; border-radius: 10px; background: var(--surface2); font-weight: 700; font-size: 16.5px; }
.path .sep { padding: 0; background: none; color: var(--fg2); }
.path .pick { background: var(--grad); color: var(--on-grad); font-size: 18px; }
.steps { display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; counter-increment: s; align-items: start; }
.steps li::before { content: counter(s); width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-weight: 800; }
.both { display: flex; flex-direction: column; gap: 10px; }
.both .card { display: flex; flex-direction: column; gap: 8px; }
.rules { display: flex; flex-direction: column; gap: 10px; }
.rules li { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: start; }
.rules .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.rules b { display: block; line-height: 1.5; }
.rules .why { font-size: 16.5px; color: var(--fg2); }
.pendingbox { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px; border: 2px dashed var(--line); color: var(--fg2); font-weight: 700; font-size: 18px; }

/* 확인해 주세요 */
.q { display: flex; flex-direction: column; gap: 12px; }
.q h3 { font-size: 20px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opts button { min-height: 56px; padding: 8px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; display: flex; align-items: center; gap: 12px; }
.opts button .r { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid var(--fg2); flex: none; display: flex; align-items: center; justify-content: center; }
.opts button[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opts button[aria-checked="true"] .r { border-color: var(--accent); background: var(--accent); }
.opts button[aria-checked="true"] .r::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--bg); }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 16px; color: var(--fg2); }
input[type="text"], textarea { font: 400 17px/1.5 var(--font); color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; min-height: 52px; }
textarea { resize: vertical; }
.sharebox textarea { min-height: 220px; background: var(--surface2); font-size: 17px; }
.incl { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 500; }
.incl input { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }
.btnrow { display: grid; grid-template-columns: 1fr; gap: 10px; }
.status { min-height: 28px; font-weight: 700; color: var(--ok); }

/* 시트 */
dialog.sheet { margin: auto auto 0; width: 100%; max-width: 520px; max-height: 92dvh; border: 0; padding: 0; border-radius: 24px 24px 0 0; background: var(--bg); color: var(--fg); overflow: auto; box-shadow: 0 -8px 40px rgba(0,0,0,.35); }
dialog.sheet::backdrop { background: rgba(4,6,16,.6); }
@media (min-width: 560px) { dialog.sheet { margin: auto; border-radius: 24px; } }
.sheetbar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 10px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
.sheetbar b { font-size: 17px; }
.xbtn { width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: var(--surface2); }
.sheetbody { padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
.sheetbody h2 { font-size: 24px; }
.bigchk { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 18px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); font-size: 19px; font-weight: 800; cursor: pointer; position: relative; }
.bigchk input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.bigchk .box { width: 34px; height: 34px; border-radius: 10px; border: 2.5px solid var(--fg2); display: flex; align-items: center; justify-content: center; color: transparent; background: var(--surface); }
.bigchk .box svg { width: 22px; height: 22px; stroke-width: 3.2; }
.bigchk input:checked + .box { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.bigchk:has(input:checked) { border-color: var(--ok); background: var(--ok-soft); }
.bigchk:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

.sheetbody h3 { margin-bottom: 6px; }
.empty { text-align: center; padding: 40px 0; color: var(--fg2); }
.srOnly { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

.cno { font-weight: 800; font-size: 17px; margin-right: 2px; }
.cut .shared { grid-column: 1 / -1; }
.shared { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 10px 14px; background: var(--accent-soft); color: var(--fg); font-size: 16px; line-height: 1.5; }
.cut .shared { border-top: 1px solid var(--line); }
.sheetbody .shared { border-radius: 14px; }

      if (el.checked && !mem.sharedSeen) {
        var oth = othersOf(id, currentContentId());
        if (oth.length) { mem.sharedSeen = true; save(); toast(names(oth) + '에서도 찍은 것으로 표시했어요'); }
      }
    }
    else if (a === 'incl') { mem.include = el.checked; save(); refreshShare(); }
  });
  document.addEventListener('input', function (e) {
    var el = e.target, q = el.getAttribute && el.getAttribute('data-memo');
    if (q) { ans(q).memo = el.value; save(); refreshShare(); }
  });
  window.addEventListener('hashchange', route);
  /* 레퍼런스 이미지 파일이 없으면(공개 배포본에서는 내부용 GIF를 올리지 않아요) 그 영역만 숨겨요 */
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'IMG' && t.closest) { var box = t.closest('.refmedia'); if (box) box.hidden = true; }
  }, true);

  /* ---------- 시작 ---------- */
  applyTheme();
  Promise.all([getJSON('data/config.json'), getJSON('data/cuts.json'), getJSON('data/contents.json'), getJSON('data/guide.json'), getJSON('data/questions.json')])
    .then(function (r) { D.config = r[0]; D.cuts = r[1]; D.contents = r[2]; D.guide = r[3]; D.questions = r[4]; index(); route(); })
    .catch(function (err) {
      $('#main').innerHTML = '<p class="empty">화면을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 보세요.</p>';
      try { console.error(err); } catch (e) {}
    });
})();
</script>
